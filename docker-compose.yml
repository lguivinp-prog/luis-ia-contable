services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sin puerto publicado en el host: solo el backend (red de compose) llega a PostgreSQL. Publicarlo en todas las
    # interfaces expondria la base de datos; para inspeccionarla use `docker compose exec db psql`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - luis-ia-contable-net

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - document_storage:/var/lib/luis-ia-contable/documents
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - luis-ia-contable-net

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-luis_ia_contable_session}
    # La cache de desarrollo de Next (`.next/dev`, en el volumen nombrado) sobrevive a los reinicios y puede conservar un arbol de rutas
    # OBSOLETO (sintoma: una pagina existente responde 404). Se descarta en CADA arranque; no hay datos de aplicacion en ella.
    command: ["sh", "-c", "rm -rf .next/dev .next/cache && exec npm run dev -- --hostname 0.0.0.0"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - luis-ia-contable-net

networks:
  luis-ia-contable-net:

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
  document_storage:
